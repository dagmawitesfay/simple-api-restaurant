 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Allergen Check</title>
    <link rel="stylesheet" href="css/style.css">
   <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
 </head>
 <body>
    
    <main> 
    <section class="hero-wrapper">

        <!-- left side -->
         <section class="left-section">
            <span>Kitchen Tools</span>
            <h1>Allergen Check</h1>
            <p>Search a product before you answer a guest</p>
         </section>

         <!--Right Section -->
         <section class="right-section">
             <label for="search">Product Name or barcode</label>
              <div class="input-wrapper">
                 <input type="text" placeholder="Basil Pesto">
                 <button type="button">Check</button>
              </div>
           
         </section>
    </section>

    <!-- PLACE WHERE THE DATA GOES  -->
     <section class="allergen-wrapper">

        <!-- Photo section -->
         <section class="photo-card">
            <img src="" alt="prdouct-image">
            <h2 id="product-name"></h2>
            <span id="brandName"></span>    
            <h3 id="barcode"></h3>
         </section>

         <!-- ALLERGERN CONTAINS Section Wrapper -->
          <section class="allergen-result">
            <!-- Contains Section -->
             <section class="contains-card">
                <p>Contains</p>

                <!-- Tags -->
                <section class="contains-tags-cards">
                    <!--  container for red tags  -->
                <div class="red-tag-container">
                    <!-- Spans will be displayed here -->
                </div>

                </section>
             </section>

             <section class="may-contain-not-listed-wrapper">
                    <!-- May contain -->
                    <section class="may-contains-cards">
                        <p class="section-label">May contain traces</p>
                        <div class="may-contains-tags"></div>
                    </section>

              <!-- Not Listed  Section -->
              <section class="not-listed-card">
                <p>Not Listed </p>
                <!-- Tags -->
                 
                <div class="not-contains-tags">
              <!-- Not listed tags -->
                </div>
             </section>      
            </section>

            <!-- Ingredients Section -->
             <section class="ingredients-card">
                <h4>Ingredients</h4>
                <p id="ingredients-list"></p>

             </section>
          </section>
     </section>
         </main>
     <script src="js/main.js"></script>
 </body>
 </html>
